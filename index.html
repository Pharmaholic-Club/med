box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#2b1d12;--ink:#f4e3c5}}
:root[data-theme="dark"]{--page:#2b1d12;--ink:#f4e3c5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:'Mali','Sarabun',sans-serif;display:grid;place-items:center;overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent;user-select:none}
body::before{content:"";position:absolute;inset:-40px;background:var(--G) center/cover;filter:blur(22px) saturate(1.1);opacity:.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid #1f6fd1;outline-offset:2px}
.wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
#stg{font-family:'Mitr',sans-serif;font-weight:600;font-size:clamp(18px,3vw,30px);min-height:1.3em;text-align:center}
#stage{--ar:1.152;--mx:780px;position:relative;container-type:inline-size;aspect-ratio:var(--ar);width:min(100vw - 20px,calc((100dvh - 100px) * var(--ar)),var(--mx));border-radius:3cqw;overflow:hidden;border:4px solid #fffaf0;box-shadow:0 12px 34px rgba(60,30,10,.4);background:#d9b983}
#stage[data-v=wide]{--ar:2;--mx:1180px;border-radius:2cqw}
.scr{position:absolute;inset:0;display:none;background-size:100% 100%}
.scr.on{display:block}
#load{background-image:var(--L)}#menu{background-image:var(--M)}#game{background-image:var(--G)}
.p{position:absolute;display:grid;place-items:center;pointer-events:none;text-align:center}
.hit{position:absolute;border-radius:18px;transition:background .15s,box-shadow .15s}
.hit:hover{background:rgba(255,255,255,.2)}
.hit:active{background:rgba(255,255,255,.35)}
/* loading */
.bar{background:#fff3d8;border:.5cqw solid #7a4e2a;border-radius:3cqw;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#ffc460,#f08a12);transition:width .2s}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font:600 max(10px,2.1cqw) 'Mitr',sans-serif;color:#5a3a22}
/* game */
.chip{font:600 max(12px,2.1cqw) 'Mitr',sans-serif;color:#fff6e2}
.chip.low{background:#d2503f!important;border-radius:1cqw;animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(1.1)}}
.say{background:#f9ead3;color:#5a3a22;font:600 max(11px,1.95cqw)/1.55 'Mali','Sarabun',sans-serif;padding:0 1.2cqw}
.say.sm{font-size:max(10px,1.65cqw)}
.ic{background:#fdf5e2;font-size:max(28px,6.2cqw);border-radius:1.2cqw}
.lb{background:#fcefd6;color:#5a3a22;font:600 max(11px,2.3cqw)/1.3 'Mitr','Mali',sans-serif;border-radius:.8cqw}
.bk{border-radius:12% 12% 40% 40%/16% 16% 40% 40%;transition:transform .15s,box-shadow .15s}
.bk.sel{transform:translateY(-1.6cqw);box-shadow:0 0 0 .5cqw #ffd45e,0 0 3cqw 1cqw #ffd45e}
.bk.ok{box-shadow:0 0 0 .5cqw #3f9b4f,0 0 3cqw 1cqw #6fd37f}
.bk.no{box-shadow:0 0 0 .5cqw #d2503f,0 0 3cqw 1cqw #f08070;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
.go{position:absolute;left:40.9%;top:84.2%;width:18.4%;height:14%;border-radius:8cqw;border:.55cqw solid #fff6e2;background:linear-gradient(#ffb94a,#f08a12);color:#fff;font:600 max(15px,3.1cqw) 'Mitr',sans-serif;text-shadow:0 .2cqw 0 rgba(0,0,0,.25);box-shadow:0 .6cqw 0 rgba(90,50,10,.4)}
.go:active{transform:translateY(.5cqw)}
.go:disabled{filter:grayscale(.85);opacity:.65;cursor:default}
/* end + modal */
.card{background:#fff6e2;color:#5a3a22;border:4px solid #c9a46c;border-radius:26px;padding:20px 26px;text-align:center;max-width:min(520px,92%);box-shadow:0 6px 0 rgba(90,50,10,.3);font-size:clamp(14px,2.2cqw,19px);line-height:1.7}
.card h2{font:600 clamp(22px,4cqw,32px) 'Mitr',sans-serif;margin:0 0 6px}
.card ol{text-align:left;margin:8px 0 14px;padding-left:22px}
.big{font:600 clamp(42px,8cqw,70px) 'Mitr',sans-serif;color:#f08a12;line-height:1.1}
.btn{font:600 clamp(16px,2.6cqw,24px) 'Mitr',sans-serif;padding:10px 30px;border-radius:40px;color:#fff;border:4px solid #fff6e2;box-shadow:0 4px 0 rgba(90,50,10,.4);text-shadow:0 2px 0 rgba(0,0,0,.25);min-width:150px}
.btn.o{background:linear-gradient(#ffb94a,#f08a12)}.btn.b{background:linear-gradient(#5ec6e6,#2c8fb8)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#end{background:var(--G)}
#end.on,#modal.on{display:grid;place-items:center}
#end::before{content:"";position:absolute;inset:0;background:rgba(50,25,10,.45)}
#end .card{position:relative}
#modal{position:absolute;inset:0;background:rgba(50,25,10,.55);display:none;padding:14px;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div id="stg"></div>
<div id="stage" role="application" aria-label="เกมตะกร้าแยกยา/อาการ">

 <section id="load" class="scr on">
  <div class="p bar" style="left:20.4%;top:89.7%;width:55.8%;height:6.2%;pointer-events:auto"><i id="barI"></i><b id="barT">0%</b></div>
 </section>

 <section id="menu" class="scr">
  <button class="hit" id="start" style="left:33%;top:37.2%;width:34%;height:11.5%;border-radius:4cqw" aria-label="เริ่มเกมใหม่"></button>
  <button class="hit" id="how" style="left:33%;top:50.8%;width:34%;height:11.5%;border-radius:4cqw" aria-label="วิธีการเล่น"></button>
  <button class="hit" id="how2" style="left:.8%;top:2.5%;width:7.6%;height:8.8%;border-radius:50%" aria-label="เมนู"></button>
 </section>

 <section id="game" class="scr">
  <div class="p chip" id="scP" style="left:11.2%;top:1.5%;width:3.5%;height:5.2%;background:#915731"><span id="score">0</span></div>
  <div class="p chip" id="tmP" style="left:95.5%;top:1.5%;width:3.5%;height:5.2%;background:#8e5738"><span id="tm">30</span></div>
  <button class="hit" id="pause" style="left:.7%;top:8.6%;width:3.6%;height:7.2%;border-radius:50%" aria-label="หยุดเกม"></button>
  <div class="p say" id="say" style="left:19.9%;top:15.2%;width:60.3%;height:18.8%"></div>

  <button class="hit bk" id="bkA" aria-pressed="false" style="left:8%;top:48%;width:28.1%;height:43%"></button>
  <button class="hit bk" id="bkB" aria-pressed="false" style="left:64%;top:48%;width:28.1%;height:43%"></button>
  <div class="p ic" id="icA" style="left:17.6%;top:48.9%;width:9.4%;height:17%"></div>
  <div class="p ic" id="icB" style="left:73%;top:48.9%;width:9.5%;height:17%"></div>
  <div class="p lb" id="lbA" style="left:16.1%;top:74.8%;width:12.3%;height:12.2%"></div>
  <div class="p lb" id="lbB" style="left:71.8%;top:74.8%;width:12.5%;height:12.2%"></div>
  <button class="go" id="go" disabled>ตอบ!</button>
 </section>

 <section id="end" class="scr">
  <div class="card"><h2>จบเกมแล้ว!</h2><div>คะแนนรวม</div><div class="big" id="fs">0</div>
   <p id="fr" style="margin:4px 0 12px"></p>
   <div class="row"><button class="btn o" id="again">เล่นอีกครั้ง</button><button class="btn b" id="home">กลับเมนู</button></div></div>
 </section>

 <div id="modal"><div class="card" id="mc"></div></div>
</div>
</div>

<script>
/* ===== ข้อมูลเกม: แก้ไข/เพิ่มคำถามตรงนี้ =====
   stage   = ชื่อด่าน (แสดงเหนือกรอบเกม)
   text    = บทพูดของเภสัชกร (คำอธิบายอาการ)
   choices = ตะกร้า 2 ใบ  { label: ชื่อบนตะกร้า, icon: อีโมจิ หรือ <img src="..."> }
   answer  = ตะกร้าที่ถูก  0 = ซ้าย, 1 = ขวา
   explain = คำอธิบายหลังตอบ (ไม่ใส่ก็ได้)                         */
const TIME_PER_QUESTION = 30;
const QUESTIONS = [
 {stage:"ด่าน: อาการนี้คืออะไร?",text:"[ตัวอย่าง] ลูกค้ามีไข้ต่ำๆ ไอ เจ็บคอ น้ำมูกไหล มา 2 วัน... นี่คืออาการของโรคอะไร?",choices:[{label:"โรคไข้หวัด",icon:"🤒"},{label:"ท้องเสีย",icon:"🤢"}],answer:0,explain:"ไอ เจ็บคอ น้ำมูกไหล เป็นอาการของไข้หวัด"},
 {stage:"ด่าน: อาการนี้คืออะไร?",text:"[ตัวอย่าง] ลูกค้าถ่ายเหลวหลายครั้ง ปวดบิดท้อง และรู้สึกอ่อนเพลีย... นี่คืออาการของโรคอะไร?",choices:[{label:"โรคไข้หวัด",icon:"🤒"},{label:"ท้องเสีย",icon:"🤢"}],answer:1,explain:"ถ่ายเหลวบ่อยและปวดบิดท้อง เป็นอาการท้องเสีย"},
 {stage:"ด่าน: อาการนี้คืออะไร?",text:"[ตัวอย่าง] ลูกค้าจามบ่อย คัดจมูก มีน้ำมูกใส และตัวร้อนเล็กน้อย... นี่คืออาการของโรคอะไร?",choices:[{label:"โรคไข้หวัด",icon:"🤒"},{label:"ท้องเสีย",icon:"🤢"}],answer:0,explain:"จาม คัดจมูก น้ำมูกใส เป็นอาการไข้หวัดทั่วไป"},
 {stage:"ด่าน: อาการนี้คืออะไร?",text:"[ตัวอย่าง] ลูกค้าคลื่นไส้ ปวดท้อง และถ่ายเป็นน้ำ... นี่คืออาการของโรคอะไร?",choices:[{label:"โรคไข้หวัด",icon:"🤒"},{label:"ท้องเสีย",icon:"🤢"}],answer:1,explain:"ถ่ายเป็นน้ำร่วมกับปวดท้อง เป็นอาการท้องเสีย"}
];
/* ============================================ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
 $('#stage').dataset.v=(id==='game'||id==='end')?'wide':'sq';if(id!=='game')$('#stg').textContent=''}
function modal(h){$('#mc').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}

let p=0;const lt=setInterval(()=>{p=Math.min(100,p+Math.random()*9+3);$('#barI').style.width=p+'%';$('#barT').textContent=Math.floor(p)+'%';
 if(p>=100){clearInterval(lt);setTimeout(()=>show('menu'),400)}},140);

let qs=[],qi=0,score=0,right=0,sel=-1,locked=false,left=TIME_PER_QUESTION,tick=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function startGame(){qs=shuffle(QUESTIONS);qi=0;score=0;right=0;$('#score').textContent=0;show('game');loadQ()}
function run(){clearInterval(tick);tick=setInterval(()=>{left--;drawT();if(left<=0){clearInterval(tick);settle(-1)}},1000)}
function loadQ(){
 const q=qs[qi];sel=-1;locked=false;$('#stg').textContent=q.stage||'';
 const s=$('#say');s.textContent=q.text;s.classList.toggle('sm',q.text.length>120);
 ['A','B'].forEach((k,i)=>{const b=$('#bk'+k);b.className='hit bk';b.setAttribute('aria-pressed','false');
  $('#ic'+k).innerHTML=q.choices[i].icon;$('#lb'+k).innerHTML='ตะกร้า:<br>'+q.choices[i].label});
 const g=$('#go');g.textContent='ตอบ!';g.disabled=true;left=TIME_PER_QUESTION;drawT();run();
}
function drawT(){$('#tm').textContent=left;$('#tmP').classList.toggle('low',left<=5)}
function pick(i){if(locked)return;sel=i;['A','B'].forEach((k,j)=>{$('#bk'+k).classList.toggle('sel',j===i);$('#bk'+k).setAttribute('aria-pressed',j===i)});$('#go').disabled=false}
function settle(c){
 locked=true;clearInterval(tick);const q=qs[qi],ok=c===q.answer;
 if(ok){right++;score+=10+Math.max(0,left);$('#score').textContent=score}
 ['A','B'].forEach((k,i)=>{const b=$('#bk'+k);b.classList.remove('sel');if(i===q.answer)b.classList.add('ok');else if(i===c)b.classList.add('no')});
 $('#say').textContent=(c===-1?'⏰ หมดเวลา! ':ok?'✅ ถูกต้อง! ':'❌ ยังไม่ใช่นะ ')+(q.explain||'');
 const g=$('#go');g.disabled=false;g.textContent=qi+1<qs.length?'ข้อต่อไป':'ดูผลคะแนน';
}
$('#bkA').onclick=()=>pick(0);$('#bkB').onclick=()=>pick(1);
$('#go').onclick=()=>{if(!locked){settle(sel);return}if(qi+1<qs.length){qi++;loadQ()}else{clearInterval(tick);$('#fs').textContent=score;$('#fr').textContent='ตอบถูก '+right+' จาก '+qs.length+' ข้อ';show('end')}};
$('#start').onclick=startGame;$('#again').onclick=startGame;$('#home').onclick=()=>show('menu');
const how=()=>modal('<h2>วิธีการเล่น</h2><ol><li>ฟังเภสัชกรเล่าอาการของลูกค้า</li><li>แตะตะกร้าที่ตรงกับโรคหรือยา</li><li>กด “ตอบ!” ก่อนหมดเวลา</li><li>ตอบเร็วได้คะแนนโบนัสเพิ่ม</li></ol><button class="btn o" data-a="cl">เข้าใจแล้ว</button>');
$('#how').onclick=how;$('#how2').onclick=how;
$('#pause').onclick=()=>{clearInterval(tick);modal('<h2>พักเกม</h2><div class="row"><button class="btn o" data-a="rs">เล่นต่อ</button><button class="btn b" data-a="qt">กลับเมนู</button></div>')};
document.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;closeModal();
 if(a==='rs'&&!locked)run();if(a==='qt'){clearInterval(tick);show('menu')}});
</script>
</body>
</html>
